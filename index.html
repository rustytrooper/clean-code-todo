<!doctype html>
<html lang="en">
    <head>
        <title>Todo App</title>
        <link
            href="https://fonts.googleapis.com/css?family=Lato:300,400,700"
            rel="stylesheet"
            type="text/css"
        />
        <link
            rel="stylesheet"
            href="style.css"
            type="text/css"
            media="screen"
        />
    </head>
    <body>
        <div class="header">
            <img src="./eisenhower-matrix.jpg" alt="priority matrix of tasks" />
            <a
                class="details-link"
                href="https://goal-life.com/page/method/matrix-eisenhower"
                >Want more details&quest;</a
            >
        </div>
        <div class="main-content">
            <div id="new-task-section">
                <label for="new-task">Add Item</label>
                <div class="task-row-wrapper">
                    <input id="new-task" class="task" type="text" />
                    <button>Add</button>
                </div>
            </div>
            <h3>Todo</h3>
            <ul id="incomplete-tasks">
                <li>
                    <input type="checkbox" />
                    <label class="task">Pay Bills</label>
                    <input type="text" class="task" />
                    <button class="edit">Edit</button>
                    <button class="delete">
                        <img src="./remove.svg" alt="removing arrow" />
                    </button>
                </li>
                <li class="edit-mode">
                    <input type="checkbox" />
                    <label class="task">Go Shopping</label>
                    <input type="text" value="Go Shopping" class="task" />
                    <button class="edit">Save</button>
                    <button class="delete">
                        <img src="./remove.svg" alt="removing arrow" />
                    </button>
                </li>
            </ul>
            <h3>Completed</h3>
            <ul id="completed-tasks">
                <li>
                    <input type="checkbox" checked />
                    <label class="task">See the Doctor</label>
                    <input type="text" class="task" />
                    <button class="edit">Edit</button>
                    <button class="delete">
                        <img src="./remove.svg" alt="removing arrow" />
                    </button>
                </li>
            </ul>
        </div>
        <script src="app.js"></script>
    </body>
</html>
